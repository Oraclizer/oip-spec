<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">OIP mobile project banner</title>
  <desc id="desc">Mobile project banner for the Oracle Interoperability Protocol specification, with its project mark and full name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060b18"/>
      <stop offset=".62" stop-color="#0a1430"/>
      <stop offset="1" stop-color="#0c1a3d"/>
    </linearGradient>
    <linearGradient id="field-a" x1="45" y1="126" x2="207" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8cc0ff"/>
