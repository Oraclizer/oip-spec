<svg xmlns="http://www.w3.org/2000/svg" width="600" height="2882" viewBox="0 0 600 2882" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="oipfvm-title oipfvm-desc">
  <title id="oipfvm-title">How the code connects to the formal models, mobile layout</title>
  <desc id="oipfvm-desc">Two repositories and the check that joins them. Oraclizer/formal-verification holds nine Isabelle/HOL sessions for the OIP product, reference profile, record reopening, recovery boundary and message interfaces, whose theorems hold under named assumptions; correspondence statements for selected Rust operations, maintained by hand; and executable models exported from the checked theories and used unedited. This repository holds the specification, the Rust reference, the Go message layer and a lock file that pins each exported model by SHA-256 and Git blob. The required Tests result check runs Rust, Go and the typed transport model on 673 inputs, and Rust and the full response model on 259 inputs; any difference fails. Not established: a refinement proof for every compiled Rust or Go run, a security audit, or deployment and production safety.</desc>
