  <text x="92" y="1863.75" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#a6f0dc">Required CI check</text>
  <text x="46" y="1894.75" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="17" fill="#5ccfb0">Tests result</text>
  <text x="46" y="1928.31" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#93a8d4">Runs on every pull request and push.</text>
  <text x="46" y="1965.29" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#d3def5">Model files are fetched by their pinned Git</text>
  <text x="46" y="1992.27" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#d3def5">blob and SHA-256, then run beside the actual</text>
  <text x="46" y="2019.25" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#d3def5">Rust and Go code.</text>
  <text x="46" y="2061.65" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#a6f0dc">Transport values</text>
  <text x="46" y="2088.63" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#d3def5">Rust, Go and the typed model on 673 inputs,</text>
  <text x="46" y="2115.61" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#d3def5">161 fixed and 512 seeded. All seven recorded</text>
  <text x="46" y="2142.59" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#d3def5">fields must match.</text>
  <text x="46" y="2184.99" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#a6f0dc">Response boundary</text>
  <text x="46" y="2211.97" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#d3def5">Rust and the full model on 259 inputs: 31 operations,</text>
  <text x="46" y="2238.95" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#d3def5">207 typed results and 21 client inputs.</text>
  <path d="M46 2254.95H554" class="sep" fill="none" stroke="#2f8f7c" stroke-width="1"/>
  <text x="46" y="2291.93" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#a6f0dc">A missing pin, a stale model or any difference fails</text>
  <text x="46" y="2318.91" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#a6f0dc">the check.</text>
  <rect class="card" x="24" y="2394.91" width="552" height="336.6" rx="20" fill="#2a1519" stroke="#e07a66" stroke-width="1.6" stroke-dasharray="7 6" fill-opacity="0.85"/>
