  <text x="63" y="1062.15" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#8cc0ff">2</text>
  <text x="92" y="1063.03" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#8cc0ff">Oraclizer/oip-spec</text>
  <text x="46" y="1094.03" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#7f93bd">this repository</text>
