  <text x="64" y="451.35" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#d3def5">and messages</text>
  <text x="64" y="476.91" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#a99fe0">Theorems hold under named assumptions</text>
  <rect class="card" x="46" y="518.91" width="508" height="122.36" rx="14" fill="#171338" stroke="#4d43a0" stroke-width="1.4"/>
  <text x="64" y="557.81" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#d4ccff">Source correspondence</text>
  <text x="64" y="589.71" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#d3def5">Named statements for selected Rust operations</text>
  <text x="64" y="615.27" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#a99fe0">maintained by hand</text>
  <rect class="card" x="46" y="657.27" width="508" height="150.76" rx="14" fill="#171338" stroke="#4d43a0" stroke-width="1.4"/>
  <text x="64" y="696.17" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#d4ccff">Exported executable models</text>
  <text x="64" y="728.07" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#d3def5">Generated from the checked theories</text>
  <text x="64" y="756.47" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#d3def5">and used unedited</text>
  <text x="64" y="782.03" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#a99fe0">typed transport · full response</text>
  <text x="28" y="864.03" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17"><tspan font-family="SFMono-Regular,Consolas,Menlo,monospace" fill="#b8aef0">consumer-binding.json</tspan></text>
  <text x="28" y="889.03" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#7f93bd">lists the exact oip-spec commit and the model pins.</text>
