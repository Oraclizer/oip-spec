  <text x="80" y="2775.51" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#93a8d4">exported model, pinned by hash</text>
  <path d="M28 2803.75 L68 2803.75" fill="none" stroke="#a493ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 6" marker-end="url(#oipfvm-violet)"/>
  <text x="80" y="2809.51" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#93a8d4">correspondence kept by hand</text>
