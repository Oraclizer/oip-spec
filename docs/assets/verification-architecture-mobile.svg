  <text x="24" y="52" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#eef3ff">How the code connects</text>
  <text x="24" y="91" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#eef3ff">to the formal models</text>
  <text x="24" y="127.1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#a8bde6">Proofs cover models of the protocol. CI holds</text>
  <text x="24" y="154.65" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#a8bde6">the Rust and Go code to models exported</text>
  <text x="24" y="182.2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#a8bde6">from those proofs.</text>
