  <circle cx="53" cy="2467.89" r="4" fill="#e07a66"/>
  <text x="70" y="2543.85" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#f3b3a6">An independent security audit</text>
  <circle cx="53" cy="2537.85" r="4" fill="#e07a66"/>
  <text x="70" y="2586.83" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#f3b3a6">Deployment, operations or production safety</text>
  <circle cx="53" cy="2580.83" r="4" fill="#e07a66"/>
  <text x="46" y="2630.39" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#e6a99c">Assumed, not proved: the compiler, the cryptographic</text>
  <text x="46" y="2655.95" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#e6a99c">primitives, and the identity, source attestation and</text>
  <text x="46" y="2681.51" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#e6a99c">storage providers.</text>
