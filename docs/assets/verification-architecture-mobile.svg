  <rect x="64" y="1349.39" width="273.542" height="30" rx="15" fill="none" stroke="#a493ff" stroke-width="1.6" stroke-dasharray="2 6"/>
  <text x="200.771" y="1370.39" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#d4ccff">correspondence kept by hand</text>
  <rect class="card" x="46" y="1417.39" width="508" height="156.68" rx="14" fill="#0b1834" stroke="#2b4677" stroke-width="1.4"/>
  <text x="64" y="1456.29" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#eef3ff">Pinned model files</text>
