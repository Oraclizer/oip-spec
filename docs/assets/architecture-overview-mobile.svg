  <text x="24" y="52" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#eef3ff">How a request moves</text>
  <text x="24" y="91" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#eef3ff">through OIP</text>
  <text x="24" y="127.1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#a8bde6">Every check runs before any state changes.</text>
  <text x="24" y="154.65" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#a8bde6">A refused request changes nothing.</text>
