<svg xmlns="http://www.w3.org/2000/svg" width="600" height="2421" viewBox="0 0 600 2421" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="oipflowm-title oipflowm-desc">
  <title id="oipflowm-title">How a request moves through OIP, mobile layout</title>
  <desc id="oipflowm-desc">A caller builds a version 6 request and signs it. The receiver, in Rust and in Go, runs nine checks in order before any effect: version profile, frame size and canonical bytes, operation set when configured, version fit and sender scope, lifetime and clock skew, signature, source attestation, operand layout and the duplicate check. Any failure returns a typed refusal and changes nothing. When all checks pass, the Rust reference checks caller authority and trusted time, runs the operation and records the outcome, which stays readable after a timeout or crash so a retry returns it instead of repeating the effect. The signed response is bound to the original request, and the caller verifies it against the request it kept. Caller identity, keys, reference time and durable storage come from trusted adapters supplied by the deployment.</desc>
