name: Tests

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  GOTOOLCHAIN: local
  GO_VERSION: 1.25.5
  GO_SHA256: 9e9b755d63b36acf30c12a9a3fc379243714c1c6d3dd72861da637f336ebb35b
  PROTOC_VERSION: "33.5"
  PROTOC_SHA256: 24e58fb231d50306ee28491f33a170301e99540f7e29ca461e0e80fd1239f8d1

# Hosted runs are for the public repository. On a private copy every job is
# skipped, and the same commands run locally.
jobs:
  rust:
    name: Rust reference tests
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.96.1
        run: rustup toolchain install 1.96.1 --profile minimal
      - name: Run the Rust tests
        run: cargo +1.96.1 test --locked
      - name: List the tests that need live services
        run: cargo +1.96.1 test --locked -- --list --ignored

  go:
    name: Go tests and wire conformance
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go ${{ env.GO_VERSION }}
        run: |
          archive="$RUNNER_TEMP/go.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            --output "$archive" "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          printf '%s  %s\n' "$GO_SHA256" "$archive" | sha256sum --check --strict
          tar -C "$RUNNER_TEMP" -xzf "$archive"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
      - name: Run the Go tests
        working-directory: go
        run: |
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          go test -mod=readonly ./...
      - name: Install Rust 1.96.1 for cross-language checks
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          echo "RUSTUP_TOOLCHAIN=1.96.1" >> "$GITHUB_ENV"
      - name: Fetch the locked Rust dependencies
        run: cargo fetch --locked
      - name: Extract the pinned Ubuntu Poly/ML userspace
        run: python3 scripts/prepare-polyml-userspace.py
      - name: Require Rust, Go and the independently pinned executable model
        run: python3 scripts/check-operations.py --require-mirror --polyml target/polyml-userspace/bin/poly
      - name: Exchange signed frames between Rust and Go
        run: python3 scripts/test-wire-interop.py

      - name: Preserve raw transport model streams
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transport-model-streams
          path: target/wire-model/*/streams/
          if-no-files-found: ignore
          retention-days: 14

  generated-bindings:
    name: Generated bindings
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go ${{ env.GO_VERSION }}
        run: |
          archive="$RUNNER_TEMP/go.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            --output "$archive" "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          printf '%s  %s\n' "$GO_SHA256" "$archive" | sha256sum --check --strict
          tar -C "$RUNNER_TEMP" -xzf "$archive"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
      - name: Install protoc ${{ env.PROTOC_VERSION }}
        run: |
          archive="$RUNNER_TEMP/protoc.zip"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            --output "$archive" "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          printf '%s  %s\n' "$PROTOC_SHA256" "$archive" | sha256sum --check --strict
          unzip -q -d "$RUNNER_TEMP/protoc" "$archive"
      - name: Build protoc-gen-go from the module requirements
        working-directory: go
        run: |
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          mkdir -p "$RUNNER_TEMP/bin"
          go build -mod=readonly -o "$RUNNER_TEMP/bin/protoc-gen-go" google.golang.org/protobuf/cmd/protoc-gen-go
      - name: Regenerate the Rust and Go bindings and compare
        run: python3 scripts/generate-wire.py --check --protoc "$RUNNER_TEMP/protoc/bin/protoc" --go-plugin "$RUNNER_TEMP/bin/protoc-gen-go"

  operation-table:
    name: Operation table
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the operation name view against its table
        run: python3 scripts/render-operations.py --check
      - name: Check strict input and output software contracts
        run: python3 scripts/test-reference-contract.py
      - name: Check typed wire protocol contracts
        run: python3 scripts/test-wire-values.py
      - name: Check exact primitive and full ABI contracts
        run: python3 scripts/test-response-full.py

  reference-execution:
    name: Source-bound reference execution
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.96.1
        run: rustup toolchain install 1.96.1 --profile minimal
      - name: Select the locked Rust toolchain
        run: echo "RUSTUP_TOOLCHAIN=1.96.1" >> "$GITHUB_ENV"
      - name: Extract the pinned Ubuntu Poly/ML userspace
        run: python3 scripts/prepare-polyml-userspace.py
      - name: Record actual source replay and signed-response cases
        run: python3 scripts/run-reference-source.py --output target/reference-execution
      - name: Observe actual typed result converter inputs
        run: python3 scripts/run-response-boundary-source.py --output target/response-boundary
      - name: Record original-operation and current-client source inputs
        run: python3 scripts/run-wire-full-source.py --output target/wire-full-source
      - name: Require the original wire response boundary
        run: python3 scripts/check-response-boundary.py --source-output target/response-boundary --operations-output target/wire-full-source --output target/response-model-comparison --polyml target/polyml-userspace/bin/poly
      - name: Preserve raw source and model streams
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-execution-streams
          path: |
            target/reference-execution/
            target/response-boundary/
            target/wire-full-source/
            target/response-model-comparison/
          if-no-files-found: ignore
          retention-days: 14

  required:
    # Single aggregate for this workflow, so a required-check list survives
    # job renames. Every other job in this workflow must be listed in needs.
    name: Tests result
    if: ${{ always() && !github.event.repository.private }}
    needs:
      - rust
      - go
      - generated-bindings
      - operation-table
      - reference-execution
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every test job to succeed
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          GO_RESULT: ${{ needs.go.result }}
          GENERATED_BINDINGS_RESULT: ${{ needs.generated-bindings.result }}
          OPERATION_TABLE_RESULT: ${{ needs.operation-table.result }}
          REFERENCE_EXECUTION_RESULT: ${{ needs.reference-execution.result }}
        run: |
          test "$RUST_RESULT" = "success"
          test "$GO_RESULT" = "success"
          test "$GENERATED_BINDINGS_RESULT" = "success"
          test "$OPERATION_TABLE_RESULT" = "success"
          test "$REFERENCE_EXECUTION_RESULT" = "success"
