[package]
name = "oip-spec"
version = "0.6.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
prost = "=0.13.5"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
